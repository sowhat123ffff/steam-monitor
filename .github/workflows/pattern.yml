name: Publish Pattern TOMLs

on:
  schedule:
    - cron: "*/15 * * * *"
    # Daily Discord summary, 09:07 UTC+8; off the 15-minute grid so it is
    # a separate run. Keep in sync with SUMMARY in Notify Discord.
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      discord_test:
        description: "Send the daily Discord summary now, marked as a test"
        type: boolean
        default: false

concurrency:
  group: pattern
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read # daily summary counts recent runs

jobs:
  pattern:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # default persist-credentials: Publish pushes via the built-in token.

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Fetch client binaries
        id: fetch
        run: |
          sha_of() { sha256sum "$1" | cut -d' ' -f1; }
          PUBLISHED=$(ls pattern/steamui/*.toml 2>/dev/null | xargs -r -n1 basename -s .toml | sort -u | tr '\n' ' ')
          for f in pattern/steamclient/*.toml; do
            [ -e "$f" ] || continue
            sha=$(basename -s .toml "$f")
            # A steamclient build counts as published only with its IPC file:
            # otherwise the old 24-entry set would mask the missing ipc/ TOML
            # and fetch would keep reporting "already published".
            if [ -f "ipc/steamclient/$sha.toml" ]; then
              PUBLISHED="$PUBLISHED $sha"
            fi
          done
          set +e
          python3 tools/fetch_client.py --out bins/ --channels stable beta --published-shas $PUBLISHED --versions-file pattern/versions.json
          CODE=$?
          set -e
          # exit 2 = all SHAs published: files still written, downstream skips.
          # exit 3 = no new binaries, but versions.json gained records for builds
          # already published under another channel (stable and beta often point
          # at the same build). Commit just that file and stop.
          if [ "$CODE" -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "versions_only=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi
          CHANNELS=""
          for channel in stable beta; do
            if [ -f "bins/$channel/steamclient64.dll" ]; then
              CHANNELS="$CHANNELS $channel"
              echo "sha_sc_$channel=$(sha_of bins/$channel/steamclient64.dll)" >> "$GITHUB_OUTPUT"
              echo "sha_sui_$channel=$(sha_of bins/$channel/SteamUI.dll)" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"

      - name: Resolve patterns + IPC
        id: resolve
        if: steps.fetch.outputs.skip != 'true'
        run: |
          : > skips.txt
          CODE_ALL=0
          for channel in ${STEPS_FETCH_OUTPUTS_CHANNELS}; do
            set +e
            python3 tools/resolve_patterns.py resolve \
              --dll "bins/$channel/steamclient64.dll" --side steamclient \
              --out-dir pattern/ > "resolve_sc_$channel.log" 2>&1
            CODE_SC=$?
            python3 tools/resolve_patterns.py resolve \
              --dll "bins/$channel/SteamUI.dll" --side steamui \
              --out-dir pattern/ > "resolve_sui_$channel.log" 2>&1
            CODE_SUI=$?
            python3 tools/resolve_ipc.py resolve \
              --dll "bins/$channel/steamclient64.dll" --channel "$channel" \
              --out-dir ipc/ > "resolve_ipc_$channel.log" 2>&1
            CODE_IPC=$?
            set -e
            cat "resolve_sc_$channel.log" "resolve_sui_$channel.log" "resolve_ipc_$channel.log"
            grep -E '^FAIL ' "resolve_sc_$channel.log" "resolve_sui_$channel.log" "resolve_ipc_$channel.log" >> skips.txt || true
            if [ "$CODE_SC" -ne 0 ] || [ "$CODE_SUI" -ne 0 ] || [ "$CODE_IPC" -ne 0 ]; then
              CODE_ALL=1
            fi
          done
          echo "code=$CODE_ALL" >> "$GITHUB_OUTPUT"
        env:
          STEPS_FETCH_OUTPUTS_CHANNELS: ${{ steps.fetch.outputs.channels }}

      - name: Commit version records
        if: steps.fetch.outputs.versions_only == 'true'
        env:
          TZ: UTC
        run: |
          # 这批 build 早已以另一个通道发布过，pattern/ 与 ipc/ 都没有新增文件，
          # 只有 versions.json 多了记录。单独提交它，让按版本号查询能对上。
          python3 -c "import json; print(json.dumps({'versions': json.load(open('pattern/versions.json'))}))" > /tmp/readme_data.json
          npx -y knap@0.4.2 render templates/readme.md \
            --data /tmp/readme_data.json --output README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern/versions.json README.md
          if git diff --cached --quiet; then
            echo "versions.json unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Record Steam build versions published under another channel"
          git push

      - name: File issue on unresolvable entries
        id: blocked
        if: steps.fetch.outputs.skip != 'true' && steps.resolve.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_SC: ${{ steps.fetch.outputs.sha_sc_stable }}
          STABLE_SUI: ${{ steps.fetch.outputs.sha_sui_stable }}
          BETA_SC: ${{ steps.fetch.outputs.sha_sc_beta }}
          BETA_SUI: ${{ steps.fetch.outputs.sha_sui_beta }}
        run: |
          # Fetch only downloads channels with unpublished SHAs; show the
          # last-published stable build so the title stays a full fingerprint.
          read STABLE_SC STABLE_SUI < <(python3 -c "
          import json
          v = json.load(open('pattern/versions.json'))
          s = {k: d for k, d in v.items() if d.get('channel') == 'stable'}
          if s:
              d = s[max(s, key=int)]
              print(d['steamclient64.dll'], d['SteamUI.dll'])
          else:
              print('', '')
          ")
          # One open issue per blocked SHA pair is enough; fresh logs live in
          # the Actions run this issue body would link to anyway.
          if gh issue list --state open --json title --jq '.[].title' \
              | grep -qF "beta ${BETA_SC}/${BETA_SUI}"; then
            echo "blocked issue for beta ${BETA_SC}/${BETA_SUI} already open, skipping"
            exit 0
          fi
          {
            echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Nothing was published (block-on-failure). Triage the skipped entries by hand, then re-run with workflow_dispatch."
            echo ""
            cat skips.txt
          } > issue_body.md
          gh issue create \
            --title "Pattern resolve blocked: stable ${STABLE_SC}/${STABLE_SUI}, beta ${BETA_SC}/${BETA_SUI}" \
            --body-file issue_body.md
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Close resolved blocked issues
        if: steps.fetch.outputs.skip != 'true' && steps.resolve.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A SHA in an issue title is published when its TOML exists under
          # pattern/; publish is all-or-nothing, so every token present means
          # the whole blocked build landed.
          gh issue list --state open --search "Pattern resolve blocked in:title" \
            --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' | while IFS="$(printf '\t')" read -r num title; do
            shas=$(echo "$title" | grep -oE '[0-9a-f]{64}' || true)
            if [ -z "$shas" ]; then continue; fi
            ok=1
            for s in $shas; do
              if [ ! -f "pattern/steamclient/$s.toml" ] && [ ! -f "pattern/steamui/$s.toml" ]; then
                ok=0
              fi
            done
            if [ "$ok" -eq 1 ]; then
              gh issue close "$num" \
                --comment "All SHAs from this issue are now published (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            fi
          done

      - name: Publish
        id: publish
        if: steps.fetch.outputs.skip != 'true' && steps.resolve.outputs.code == '0'
        env:
          # README timestamps render in runner-local time; pin UTC.
          TZ: UTC
        run: |
          python3 -c "import json; print(json.dumps({'versions': json.load(open('pattern/versions.json'))}))" > /tmp/readme_data.json
          npx -y knap@0.4.2 render templates/readme.md \
            --data /tmp/readme_data.json --output README.md
          ver() { python3 -c "import json; print(json.load(open('bins/$1/versions.json'))['version'])" 2>/dev/null || echo skipped; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern/ ipc/ README.md
          git commit -m "Update Steam rule patterns (stable $(ver stable), beta $(ver beta))"
          git push

      - name: Notify Discord
        # Events that need a human: new build published, a newly filed
        # blocked issue (not every re-run while it stays open), job failure.
        # Plus the daily summary (a missing one means the schedule stopped)
        # and its workflow_dispatch test.
        if: always() && (steps.publish.outcome == 'success' || steps.blocked.outputs.created == 'true' || job.status == 'failure' || github.event.schedule == '7 1 * * *' || inputs.discord_test)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          BLOCKED: ${{ steps.blocked.outputs.created == 'true' }}
          FAILED: ${{ job.status == 'failure' }}
          SUMMARY: ${{ github.event.schedule == '7 1 * * *' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          export RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pattern.yml/runs?created=>=$since&per_page=1" --jq .total_count || echo "?")
          # Embed card like the old steam-monitor-bot; the run link sits on
          # the title so Discord shows no GitHub preview.
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from datetime import datetime, timezone

          env = os.environ
          def git(fmt):
              return subprocess.check_output(["git", "log", "-1", f"--format={fmt}"], text=True).strip()
          versions = json.load(open("pattern/versions.json"))
          def last(ch):
              b = [int(k) for k, d in versions.items() if d.get("channel") == ch]
              return str(max(b)) if b else "-"
          head = f"`{git('%h')}` ({git('%cs')})"

          if env["PUBLISHED"] == "true":
              title, color = "✅ 已发布新 build", 0x2ECC71
              desc = f"{git('%s')}\nmain {head}"
          elif env["BLOCKED"] == "true":
              title, color = "🚨 Pattern 解析被阻塞 — 未发布", 0xE74C3C
              desc = "已开 issue。人工处理后用 workflow_dispatch 重跑。"
          elif env["FAILED"] == "true":
              title, color = "⚠️ 运行失败", 0xF1C40F
              desc = "点标题查看 Actions 日志。"
          else:
              runs = env.get("RUNS") or "?"
              # The count includes this run; 1 means the */15 schedule did nothing.
              ok = runs.isdigit() and int(runs) >= 2
              title = "✅ 每日摘要 — 新链路运行正常" if ok else "⚠️ 每日摘要 — 定时运行偏少"
              color = 0x2ECC71 if ok else 0xF1C40F
              desc = (f"近 24 小时运行 {runs} 次 · stable `{last('stable')}` · "
                      f"beta `{last('beta')}` · main {head}")
              if env["SUMMARY"] != "true":
                  title = "🧪 测试 · " + title

          payload = {"embeds": [{
              "title": title, "url": env["RUN_URL"], "description": desc, "color": color,
              "footer": {"text": env["GITHUB_REPOSITORY"]},
              "timestamp": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }]}
          req = urllib.request.Request(
              env["DISCORD_WEBHOOK_URL"], data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "steam-monitor-workflow"})
          urllib.request.urlopen(req, timeout=30).close()
          PY
